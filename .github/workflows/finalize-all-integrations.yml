name: Finalize All Integrations

on:
  workflow_dispatch:
  push:
    branches:
      - agent/all-integrations-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/all-integrations-final
          fetch-depth: 0

      - name: Materialize platform and app integrations
        run: python3 tool/finalize_integrations.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Android release
        run: flutter build apk --release

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- pubspec.yaml pubspec.lock android ios lib test docs README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Integrate health, wearables, cloud sync, social options, guides, and Lab experiments"
          git fetch origin agent/all-integrations-final
          git rebase origin/agent/all-integrations-final
          git push origin HEAD:agent/all-integrations-final
