name: Progression Lab 2.1 Candidate Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: progression-lab-2-1-validation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: Verify canonical 2.1 source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Guard the canonical PR 17 architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/integrations_hub.dart
          test -f lib/health_sync.dart
          test -f lib/external_workout_formats.dart
          test -f lib/provider_integrations.dart
          test -f lib/cloud_sync.dart
          test -f lib/contextual_guides.dart
          test -f lib/lab_experiments.dart
          test -f lib/share_options.dart
          test -f android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/IntegrationBridge.kt
          test -f android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/PermissionsRationaleActivity.kt
          test -f ios/Runner/IntegrationBridge.swift
          for parallel_file in \
            lib/external_activity.dart \
            lib/account_connectors.dart \
            lib/cloud_backup_sync.dart \
            lib/contextual_tips.dart \
            lib/personal_experiments.dart \
            lib/share_studio.dart; do
            if [[ -e "$parallel_file" ]]; then
              echo "Refusing to mix the PR 18 parallel implementation: $parallel_file" >&2
              exit 1
            fi
          done

      - name: Verify required wiring and release metadata
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '^version: 2.1.0+14$' pubspec.yaml
          grep -q "import 'integrations_hub.dart';" lib/main.dart
          grep -q 'Connections & Experiments' lib/main.dart
          grep -q 'IntegrationsHubScreen' lib/main.dart
          grep -q 'versionCode = 14' android/app/build.gradle.kts
          grep -q 'versionName = "2.1.0"' android/app/build.gradle.kts
          grep -q 'androidx.health.connect:connect-client:1.1.0' android/app/build.gradle.kts
          grep -q 'android.permission.health.READ_EXERCISE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.WRITE_EXERCISE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.READ_WEIGHT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.WRITE_WEIGHT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.READ_BODY_FAT' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.health.WRITE_BODY_FAT' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.apps.healthdata' android/app/src/main/AndroidManifest.xml
          grep -q 'androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.VIEW_PERMISSION_USAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.START_VIEW_PERMISSION_USAGE' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="progressionlab"' android/app/src/main/AndroidManifest.xml
          grep -q 'IntegrationBridge(this, flutterEngine.dartExecutor.binaryMessenger)' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt
          grep -q '"writeBodyFat" -> scope.launch' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/IntegrationBridge.kt
          grep -q 'percentage = Percentage(raw)' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/IntegrationBridge.kt
          grep -q 'Progression Lab and Health Connect' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/PermissionsRationaleActivity.kt
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'NSHealthShareUsageDescription' ios/Runner/Info.plist
          grep -q 'NSHealthUpdateUsageDescription' ios/Runner/Info.plist
          grep -q 'CFBundleURLTypes' ios/Runner/Info.plist
          grep -q 'case "writeBodyFat":' ios/Runner/IntegrationBridge.swift
          grep -q 'toShare: \[workout, bodyMass, bodyFat\]' ios/Runner/IntegrationBridge.swift
          grep -q 'IMPORT RECENT BODY METRICS' lib/integrations_hub.dart
          grep -q 'WRITE LATEST LOCAL BODYWEIGHT' lib/integrations_hub.dart
          grep -q 'ADD & WRITE BODY-FAT READING' lib/integrations_hub.dart
          grep -q "'healthBodyMetrics': healthBodyMetrics" lib/integrations_hub.dart
          test -f test/health_sync_test.dart
          python3 - <<'PY'
          import re
          from pathlib import Path

          activity = Path('android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt').read_text()
          assert activity.count('override fun onActivityResult(') == 1
          assert activity.count('override fun onDestroy()') == 1

          gradle = Path('android/app/build.gradle.kts').read_text()
          assert gradle.count('\ndependencies {') == 1
          assert gradle.count('kotlinx-coroutines-android:') == 1

          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()
          assert manifest.count('<queries>') == 1
          assert manifest.count('android.permission.health.WRITE_BODY_FAT') == 1
          assert manifest.count('androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE') == 1
          assert manifest.count('android.intent.action.VIEW_PERMISSION_USAGE') == 1

          project = Path('ios/Runner.xcodeproj/project.pbxproj').read_text()
          phase_pattern = re.compile(
              r'([A-F0-9]{24} /\* Sources \*/ = \{.*?files = \()(.*?)(\n\s*\);)',
              re.S,
          )
          runner_phase = next(
              (match.group(2) for match in phase_pattern.finditer(project)
               if 'AppDelegate.swift in Sources' in match.group(2)),
              None,
          )
          assert runner_phase is not None
          assert runner_phase.count('IntegrationBridge.swift in Sources') == 1
          test_phase = next(
              (match.group(2) for match in phase_pattern.finditer(project)
               if 'RunnerTests.swift in Sources' in match.group(2)),
              None,
          )
          assert test_phase is not None
          assert 'IntegrationBridge.swift in Sources' not in test_phase
          PY

      - name: Record candidate SHA
        id: candidate
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Analyze, test, and build Android
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-contract.outputs.candidate_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze-results.txt

      - name: Run all Flutter tests with per-file timeouts
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          test_files=(test/*_test.dart)
          if (( ${#test_files[@]} == 0 )); then
            echo 'No Flutter test files were found.' >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "=== Running ${test_file} ==="
            timeout --signal=INT --kill-after=10s 180s \
              flutter test "$test_file" --reporter expanded
          done 2>&1 | tee test-results.txt

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.1.0-validation-${{ needs.source-contract.outputs.candidate_sha }}
          path: |
            analyze-results.txt
            test-results.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce analysis and test results
        if: steps.analyze.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name 2.1.0
          --build-number 14

      - name: Prepare Android artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Progression-Lab-2.1.0+14.apk
          (cd dist && sha256sum Progression-Lab-2.1.0+14.apk > Progression-Lab-2.1.0+14.apk.sha256)

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.1.0-build-14
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Build iOS simulator and unsigned device artifacts
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Check out candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-contract.outputs.candidate_sha }}

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Build simulator app
        id: simulator
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug \
            --build-name 2.1.0 \
            --build-number 14 2>&1 | tee ios-simulator-build.txt

      - name: Build unsigned device app
        id: device
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --build-name 2.1.0 \
            --build-number 14 2>&1 | tee ios-device-build.txt

      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.1.0-iOS-validation-${{ needs.source-contract.outputs.candidate_sha }}
          path: |
            ios-simulator-build.txt
            ios-device-build.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce iOS build results
        if: steps.simulator.outcome != 'success' || steps.device.outcome != 'success'
        run: exit 1

      - name: Package iOS test artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            dist/Progression-Lab-2.1.0+14-iOS-Simulator.zip
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            dist/Progression-Lab-2.1.0+14-iOS-Unsigned-Device.zip

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.1.0-build-14-iOS
          path: dist/*
          if-no-files-found: error
          retention-days: 30
