name: Apply Consolidation Test Fixes

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab
          fetch-depth: 0

      - name: Apply migrated tests
        run: |
          set -euo pipefail
          git apply --check tool/consolidation-test-fixes.patch
          git apply tool/consolidation-test-fixes.patch

      - name: Commit and publish migrated tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/program_test.dart test/daily_inputs_lab_test.dart test/navigation_widget_test.dart
          git commit -m "Align tests with the unified catalog and current schema"
          git fetch origin agent/daily-inputs-gemini-lab
          git rebase origin/agent/daily-inputs-gemini-lab
          git push origin HEAD:agent/daily-inputs-gemini-lab
