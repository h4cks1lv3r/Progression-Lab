name: Materialize Platform Integrations

on:
  workflow_dispatch:
  push:
    branches:
      - agent/all-integrations-final

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/all-integrations-final
          fetch-depth: 0

      - name: Add dependencies and wire Android and Flutter entry points
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Dart packages used by the open workout-file parsers and OAuth PKCE.
          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          dependency_anchor = '  cupertino_icons:'
          additions = []
          if re.search(r'^  xml:', text, re.M) is None:
              additions.append('  xml: ^6.5.0')
          if re.search(r'^  crypto:', text, re.M) is None:
              additions.append('  crypto: ^3.0.6')
          if additions:
              match = re.search(r'^  cupertino_icons:.*$', text, re.M)
              if match is None:
                  raise SystemExit('Could not locate the Flutter dependency section.')
              text = text[:match.end()] + '\n' + '\n'.join(additions) + text[match.end():]
              pubspec.write_text(text)

          # Android native dependencies.
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          dependency_lines = '''

dependencies {
    implementation("androidx.health.connect:connect-client:1.1.0-alpha11")
    implementation("androidx.documentfile:documentfile:1.0.1")
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
}
'''
          if 'androidx.health.connect:connect-client' not in text:
              text = text.rstrip() + dependency_lines
              gradle.write_text(text)

          # Android permissions and OAuth callback route.
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.health.READ_EXERCISE',
              'android.permission.health.WRITE_EXERCISE',
              'android.permission.health.READ_WEIGHT',
              'android.permission.health.WRITE_WEIGHT',
              'android.permission.health.READ_BODY_FAT',
          ]
          application_index = text.find('<application')
          if application_index < 0:
              raise SystemExit('AndroidManifest.xml has no application element.')
          prefix = ''
          for permission in permissions:
              if permission not in text:
                  prefix += f'    <uses-permission android:name="{permission}" />\n'
          if prefix:
              text = text[:application_index] + prefix + text[application_index:]
          if 'android:scheme="progressionlab"' not in text:
              activity_start = text.find('<activity')
              activity_end = text.find('</activity>', activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit('Could not locate the Android activity element.')
              oauth_filter = '''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="progressionlab" android:host="oauth" />
            </intent-filter>
'''
              text = text[:activity_end] + oauth_filter + text[activity_end:]
          manifest.write_text(text)

          # Register the Android bridge without disturbing the existing storage,
          # sharing, Gemini, and backup channels in MainActivity.
          main_activity = Path('android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt')
          text = main_activity.read_text()
          if 'import android.content.Intent' not in text:
              package_end = text.find('\n', text.find('package ')) + 1
              text = text[:package_end] + '\nimport android.content.Intent\n' + text[package_end:]
          if 'private var integrationBridge: IntegrationBridge?' not in text:
              class_match = re.search(r'class\s+MainActivity\s*:\s*FlutterActivity\s*\(\s*\)\s*\{', text)
              if class_match is None:
                  raise SystemExit('Could not locate MainActivity class declaration.')
              text = text[:class_match.end()] + '\n    private var integrationBridge: IntegrationBridge? = null\n' + text[class_match.end():]
          if 'IntegrationBridge(this, flutterEngine.dartExecutor.binaryMessenger)' not in text:
              method = re.search(r'override\s+fun\s+configureFlutterEngine\s*\([^)]*\)\s*\{', text)
              if method is None:
                  insert = '''
    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        integrationBridge = IntegrationBridge(this, flutterEngine.dartExecutor.binaryMessenger)
    }

'''
                  class_close = text.rfind('}')
                  text = text[:class_close] + insert + text[class_close:]
              else:
                  super_call = text.find('super.configureFlutterEngine(flutterEngine)', method.end())
                  if super_call < 0:
                      raise SystemExit('configureFlutterEngine has no super call.')
                  line_end = text.find('\n', super_call)
                  text = text[:line_end+1] + '        integrationBridge = IntegrationBridge(this, flutterEngine.dartExecutor.binaryMessenger)\n' + text[line_end+1:]
          if 'integrationBridge?.handleIntent(intent)' not in text:
              insert = '''
    override fun onNewIntent(intent: Intent) {
        super.onNewIntent(intent)
        setIntent(intent)
        integrationBridge?.handleIntent(intent)
    }

    override fun onDestroy() {
        integrationBridge?.dispose()
        integrationBridge = null
        super.onDestroy()
    }

'''
              class_close = text.rfind('}')
              text = text[:class_close] + insert + text[class_close:]
          main_activity.write_text(text)

          # Make the integrations hub discoverable from More by duplicating the
          # existing Data & Backup navigation tile and replacing its route.
          main_dart = Path('lib/main.dart')
          text = main_dart.read_text()
          if "import 'integrations_hub.dart';" not in text:
              imports = list(re.finditer(r"^import\s+'[^']+';\s*$", text, re.M))
              if not imports:
                  raise SystemExit('main.dart has no local imports.')
              position = imports[-1].end()
              text = text[:position] + "\nimport 'integrations_hub.dart';" + text[position:]
          if 'Connections & Experiments' not in text:
              title_index = text.find('Data & Backup')
              if title_index < 0:
                  raise SystemExit('Could not locate the Data & Backup menu tile.')
              line_start = text.rfind('\n', 0, title_index) + 1
              indentation = len(text[line_start:]) - len(text[line_start:].lstrip(' '))
              # Walk backward to the constructor line at the same or shallower indentation.
              candidate = line_start
              start = None
              while candidate > 0:
                  previous = text.rfind('\n', 0, candidate - 1) + 1
                  line = text[previous:text.find('\n', previous)]
                  stripped = line.strip()
                  current_indent = len(line) - len(line.lstrip(' '))
                  if current_indent <= indentation and re.match(r'[A-Za-z_][A-Za-z0-9_<>]*\s*\(', stripped):
                      start = previous
                      break
                  candidate = previous
              if start is None:
                  raise SystemExit('Could not identify the Data & Backup widget block.')
              open_pos = text.find('(', start)
              depth = 0
              quote = None
              escape = False
              end = None
              for index in range(open_pos, len(text)):
                  char = text[index]
                  if quote:
                      if escape:
                          escape = False
                      elif char == '\\':
                          escape = True
                      elif char == quote:
                          quote = None
                      continue
                  if char in "'\"":
                      quote = char
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(text) and text[end] in ' ,\n':
                              end += 1
                          break
              if end is None:
                  raise SystemExit('Could not close the Data & Backup widget block.')
              block = text[start:end]
              if 'DataManagementScreen' not in block:
                  # Expand to include an immediately following callback if the
                  # tile constructor receives a named route helper.
                  pass
              clone = block.replace('Data & Backup', 'Connections & Experiments', 1)
              clone = clone.replace('DataManagementScreen', 'IntegrationsHubScreen')
              clone = re.sub(r'Icons\.[A-Za-z0-9_]+', 'Icons.hub_rounded', clone, count=1)
              strings = list(re.finditer(r"'([^'\\]|\\.)*'", clone))
              for match in strings:
                  value = match.group(0)
                  if 'Connections & Experiments' in value:
                      continue
                  if any(word in value.lower() for word in ('backup', 'restore', 'import', 'export', 'data')):
                      clone = clone[:match.start()] + "'Health, wearables, cloud sync, sharing, and Lab experiments.'" + clone[match.end():]
                      break
              if 'IntegrationsHubScreen' not in clone:
                  # Common tile APIs expose an onTap callback. Replace its body
                  # while preserving the constructor's visual parameters.
                  callback = re.search(r'onTap\s*:\s*\(\)\s*=>[^,]+,', clone, re.S)
                  if callback:
                      route = "onTap: () => Navigator.of(context).push(MaterialPageRoute<void>(builder: (_) => IntegrationsHubScreen(store: store))),"
                      clone = clone[:callback.start()] + route + clone[callback.end():]
              if 'IntegrationsHubScreen' not in clone:
                  raise SystemExit('The cloned menu tile could not be routed to IntegrationsHubScreen.')
              text = text[:end] + clone + text[end:]
          main_dart.write_text(text)
          PY

      - name: Format generated source
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart format lib android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/IntegrationBridge.kt

      - name: Commit platform integration source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml android lib/main.dart
          git commit -m "Wire Health, cloud, provider, and workout-file integrations"
          git push origin HEAD:agent/all-integrations-final
