name: Publish Progression Lab 2.1.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-progression-lab-2.1.1.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified 2.1.1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download the validated Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 32606346928 \
            --repo "$GITHUB_REPOSITORY" \
            --name Progression-Lab-2.1.1-build-15 \
            --dir dist
          test -f dist/Progression-Lab-2.1.1.apk
          test -f dist/Progression-Lab-2.1.1.apk.sha256

      - name: Verify the exact validated APK
        shell: bash
        run: |
          set -euo pipefail
          expected='cf5e47e1491c03950595e8fafd466b696ca96d3203842629215d2eda2383147e'
          actual="$(sha256sum dist/Progression-Lab-2.1.1.apk | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "APK digest mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          printf '%s  %s\n' "$actual" 'Progression-Lab-2.1.1.apk' \
            > dist/Progression-Lab-2.1.1.apk.sha256

      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Progression Lab 2.1.1+15

          This maintenance release corrects Functional Training progress tracking.

          ### Corrected

          - Progress now has separate **Strength** and **Functional** views.
          - The Functional drill dropdown is populated from the complete 12-week program, even before the first session is logged.
          - Completed Functional sessions now populate drill completion history, current-run totals, average effort, last completion, drill guidance, and program appearances.
          - Functional drills no longer depend on Strength set logs or display fabricated weight, repetition, volume, or estimated-1RM values.
          - Functional list scrolling and the Program Appearances expansion panel now keep independent page-storage state.

          ### Validation

          Flutter analysis and the complete test suite passed on Android and iOS CI. The Android release APK, iOS Simulator app, and unsigned iPhone app compiled successfully from the exact merged source tree.

          ### Integrity

          `Progression-Lab-2.1.1.apk` SHA-256:

          `cf5e47e1491c03950595e8fafd466b696ca96d3203842629215d2eda2383147e`

          ### Installation note

          This remains a test-distribution build, not an APK signed with the permanent Play Store production key. Android rejects an in-place update when the installed copy uses a different signing certificate. Back up important local data before uninstalling or replacing an existing build.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='v2.1.1'
          target='a34431d46c96512464d5fa02ada66088d12fb476'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/Progression-Lab-2.1.1.apk \
              dist/Progression-Lab-2.1.1.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" \
              --title 'Progression Lab 2.1.1' \
              --notes-file release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              dist/Progression-Lab-2.1.1.apk \
              dist/Progression-Lab-2.1.1.apk.sha256 \
              --target "$target" \
              --title 'Progression Lab 2.1.1' \
              --notes-file release-notes.md \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Download and verify the GitHub-hosted APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='cf5e47e1491c03950595e8fafd466b696ca96d3203842629215d2eda2383147e'
          mkdir -p published
          gh release download v2.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Progression-Lab-2.1.1.apk' \
            --dir published
          actual="$(sha256sum published/Progression-Lab-2.1.1.apk | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Published APK digest mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.1.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,url,assets \
            --jq '{tag: .tagName, name: .name, url: .url, assets: [.assets[].name]}' \
            | tee published-release.json
          grep -q 'Progression-Lab-2.1.1.apk' published-release.json
          grep -q 'Progression-Lab-2.1.1.apk.sha256' published-release.json
