name: Materialize Durable Autosave and First-Launch Import

on:
  push:
    branches:
      - feature/durable-autosave-first-launch-import
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/durable-autosave-first-launch-import
          fetch-depth: 0

      - name: Apply direct-source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/materialize_durable_autosave_import.py
          python3 tool/fix_durable_autosave_nullability.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib test
          git diff --check

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 2.2.0+16$' pubspec.yaml
          grep -q 'versionCode = 16' android/app/build.gradle.kts
          grep -q 'versionName = "2.2.0"' android/app/build.gradle.kts
          grep -q "import 'first_launch_data_setup.dart';" lib/main.dart
          grep -q 'FirstLaunchDataSetupScreen(store: widget.store)' lib/main.dart
          grep -q 'static const int schemaVersion = 16;' lib/store.dart
          grep -q 'Future<void> flushPendingSaves()' lib/store.dart
          grep -q "'dataSetupVersionSeen': dataSetupVersionSeen" lib/store.dart
          grep -q 'class FirstLaunchDataSetupScreen' lib/first_launch_data_setup.dart
          grep -q 'startImportOnOpen: true' lib/first_launch_data_setup.dart
          grep -q 'closeAfterImport: true' lib/first_launch_data_setup.dart
          grep -q 'AtomicFile' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt
          grep -q 'readLocalState(preferences)' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt
          ! grep -q 'putString("state"' android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt
          grep -q 'localStateURL()' ios/Runner/AppDelegate.swift
          grep -q 'options: .atomic' ios/Runner/AppDelegate.swift
          grep -q 'first app open presents data setup before the visual tour' test/persistence_onboarding_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run persistence and onboarding tests
        run: flutter test test/persistence_onboarding_test.dart --reporter expanded

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/main.dart \
            lib/store.dart \
            lib/data_management_screen.dart \
            lib/data_portability_core.dart \
            lib/first_launch_data_setup.dart \
            test/persistence_onboarding_test.dart \
            android/app/build.gradle.kts \
            android/app/src/main/kotlin/com/h4cks1lv3/iron_cadence/MainActivity.kt \
            ios/Runner/AppDelegate.swift \
            pubspec.yaml \
            README.md \
            CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add durable autosave and first-launch data import'
            git push origin HEAD:feature/durable-autosave-first-launch-import
          fi
