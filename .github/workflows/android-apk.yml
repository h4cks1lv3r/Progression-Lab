name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Package source snapshot
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.dart_tool \
            --exclude=build \
            -czf /tmp/Progression-Lab-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-source-${{ github.sha }}
          path: /tmp/Progression-Lab-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Read application version
        id: version
        shell: bash
        run: |
          version_line="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ ! "$version_line" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid pubspec version: $version_line" >&2
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.number }}"

      - name: Prepare distributable
        shell: bash
        run: |
          mkdir -p dist
          apk_name="Progression-Lab-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-${{ steps.version.outputs.name }}-build-${{ steps.version.outputs.number }}
          path: |
            dist/Progression-Lab-${{ steps.version.outputs.name }}.apk
            dist/Progression-Lab-${{ steps.version.outputs.name }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
