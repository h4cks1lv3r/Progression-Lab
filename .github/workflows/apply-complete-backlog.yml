name: Apply Complete Backlog Source

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out materialized branch
        uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab
          fetch-depth: 0

      - name: Recover and verify the complete backlog patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('tool')

          def read(path: str) -> str:
              return ''.join((root / path).read_text(encoding='utf-8').split())

          group0 = ''.join(
              read(f'complete-backlog.patch.part00{suffix}')
              for suffix in 'abcde'
          )
          group1 = ''.join(
              read(f'complete-backlog.patch.part01{suffix}')
              for suffix in 'abcde'
          )
          group2 = ''.join(
              read(f'complete-backlog.patch.part02{suffix}')
              for suffix in 'abcd'
          )
          group3 = read('complete-backlog.patch.part03')

          # Three one-character transport errors were isolated against the
          # original gzip checksum, uncompressed CRC, and git-apply result.
          # Repair those errors deterministically before decoding.
          if group0[11102] != 'p':
              raise SystemExit(f'Unexpected group-0 character at 11102: {group0[11102]!r}')
          group0 = group0[:11102] + 'P' + group0[11103:]

          if group0[18000] != 'U':
              raise SystemExit(f'Unexpected extra group-0 character at 18000: {group0[18000]!r}')
          group0 = group0[:18000] + group0[18001:]

          payload = group0 + group1 + group2 + group3
          if payload[92406] != 'l':
              raise SystemExit(f'Unexpected payload character at 92406: {payload[92406]!r}')
          payload = payload[:92406] + 't' + payload[92407:]

          compressed = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(compressed).hexdigest()
          expected_digest = 'b2c07b2a83c1e83419fb78356626b9ad49da4559dd202308e804f47b87961e3d'
          if digest != expected_digest:
              raise SystemExit(f'Complete-backlog gzip checksum mismatch: {digest}')

          patch = gzip.decompress(compressed)
          expected_length = 562260
          if len(patch) != expected_length:
              raise SystemExit(
                  f'Complete-backlog patch length mismatch: {len(patch)} != {expected_length}'
              )
          if not patch.startswith(b'diff --git '):
              raise SystemExit('Recovered payload is not a git patch.')

          Path('/tmp/complete-backlog.patch.gz').write_bytes(compressed)
          Path('/tmp/complete-backlog.patch').write_bytes(patch)
          print(f'Recovered verified patch: {len(compressed)} compressed bytes, {len(patch)} patch bytes')
          PY
          git apply --check /tmp/complete-backlog.patch

      - name: Apply the complete backlog layer
        run: git apply --whitespace=fix /tmp/complete-backlog.patch

      - name: Package materialized source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.dart_tool \
            -czf /tmp/Progression-Lab-complete-backlog-source.tgz .

      - name: Upload materialized source
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-complete-backlog-source-${{ github.sha }}
          path: /tmp/Progression-Lab-complete-backlog-source.tgz
          retention-days: 3

      - name: Commit materialized source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            CHANGELOG.md \
            README.md \
            android \
            ios \
            lib \
            pubspec.lock \
            pubspec.yaml \
            test \
            docs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Materialize Progression Lab 2.0.0 complete backlog source"
          git push origin HEAD:agent/daily-inputs-gemini-lab
