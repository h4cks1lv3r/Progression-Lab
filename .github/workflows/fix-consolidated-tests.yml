name: Fix Consolidated Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab
          fetch-depth: 0

      - name: Fix the two remaining widget-test contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/navigation_widget_test.dart')
          text = path.read_text()

          old = """    expect(store.workoutIndex, 4);
    expect(find.text('CHANGE CADENCE'), findsNothing);
  });
"""
          new = """    expect(store.workoutIndex, 4);
  });
"""
          if old not in text:
              raise SystemExit('Cadence-sheet assertion was not found.')
          text = text.replace(old, new, 1)

          old = """    await tester.tap(find.text('Barbell Bench Press'));
"""
          new = """    await tester.tap(find.text('Barbell Bench Press').last);
"""
          if old not in text:
              raise SystemExit('Built-in exercise tap was not found.')
          text = text.replace(old, new, 1)

          old = """    await tester.tap(find.text('Researcher Offset Row'));
"""
          new = """    await tester.tap(find.text('Researcher Offset Row').last);
"""
          if old not in text:
              raise SystemExit('Custom exercise tap was not found.')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit and publish fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/navigation_widget_test.dart
          git commit -m "Fix final consolidated widget-test contracts"
          git fetch origin agent/daily-inputs-gemini-lab
          git rebase origin/agent/daily-inputs-gemini-lab
          git push origin HEAD:agent/daily-inputs-gemini-lab
