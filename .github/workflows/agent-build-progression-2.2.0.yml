name: Build Progression Lab 2.2.0

on:
  push:
    branches:
      - agent/progression-data-durability-20260902
    paths:
      - .github/workflows/agent-build-progression-2.2.0.yml
      - .github/agent-patch/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-and-commit:
    name: Verify, build, and commit durable-data upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact branch state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reconstruct, verify, and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-patch/part-* > /tmp/progression-data-upgrade.patch.gz.b64
          echo "24c14776bebe9a9e4313f16a51d105f2d323fddf8c364a57e7ed99d685c19869  /tmp/progression-data-upgrade.patch.gz.b64" | sha256sum --check
          base64 --decode /tmp/progression-data-upgrade.patch.gz.b64 \
            | gzip --decompress > /tmp/progression-data-upgrade.patch
          echo "6cbc33eaf7cfc5900fe3ed1e3dea87f1490ba8f6b83d88c33eceb7fc7dd48bf5  /tmp/progression-data-upgrade.patch" | sha256sum --check
          git apply --check /tmp/progression-data-upgrade.patch
          git apply /tmp/progression-data-upgrade.patch
          git diff --check

      - name: Format changed Dart source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/data_management_screen.dart \
            lib/data_portability.dart \
            lib/data_portability_bridge.dart \
            lib/data_portability_core.dart \
            lib/first_launch_data_flow.dart \
            lib/main.dart \
            lib/store.dart \
            test/data_portability_test.dart \
            test/startup_data_flow_test.dart
          git diff --check

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze-results.txt

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          for test_file in test/*_test.dart; do
            echo "=== Running ${test_file} ==="
            timeout --signal=INT --kill-after=10s 180s \
              flutter test "${test_file}" --reporter expanded
          done 2>&1 | tee test-results.txt

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release \
            --build-name 2.2.0 \
            --build-number 16 2>&1 | tee build-results.txt

      - name: Prepare verified distributable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/Progression-Lab-2.2.0.apk
          (cd dist && sha256sum Progression-Lab-2.2.0.apk \
            > Progression-Lab-2.2.0.apk.sha256)
          git diff --stat > dist/SOURCE-CHANGES.txt

      - name: Commit the exact verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden data durability and expand migration imports"
          git push origin HEAD:agent/progression-data-durability-20260902
          git rev-parse HEAD > dist/BUILD-COMMIT.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.2.0-build-16
          path: |
            dist/Progression-Lab-2.2.0.apk
            dist/Progression-Lab-2.2.0.apk.sha256
            dist/BUILD-COMMIT.txt
            dist/SOURCE-CHANGES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-2.2.0-validation-${{ github.sha }}
          path: |
            analyze-results.txt
            test-results.txt
            build-results.txt
          if-no-files-found: warn
          retention-days: 7
