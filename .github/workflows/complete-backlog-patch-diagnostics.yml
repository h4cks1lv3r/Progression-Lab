name: Complete Backlog Patch Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab

      - name: Decode and repair the complete-backlog payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch-diagnostics
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('tool')
          output = Path('/tmp/patch-diagnostics')
          expected = 'b2c07b2a83c1e83419fb78356626b9ad49da4559dd202308e804f47b87961e3d'

          def compact(paths: list[Path]) -> str:
              return ''.join(''.join(path.read_text().split()) for path in paths)

          group00_paths = sorted(root.glob('complete-backlog.patch.part00[a-z]'))
          group01_paths = sorted(root.glob('complete-backlog.patch.part01[a-z]'))
          group02_paths = sorted(root.glob('complete-backlog.patch.part02[a-z]'))
          group03_paths = [root / 'complete-backlog.patch.part03']

          group00 = compact(group00_paths)
          tail = b''.join(
              base64.b64decode(compact(paths), validate=True)
              for paths in (group01_paths, group02_paths, group03_paths)
          )

          report = {
              'expected_sha256': expected,
              'group00_chars': len(group00),
              'group00_mod4': len(group00) % 4,
              'group00_files': [str(path) for path in group00_paths],
              'tail_bytes': len(tail),
          }

          # One extra base64 character exists somewhere in group 00. Remove
          # each position in turn and accept only a candidate that produces a
          # complete gzip member containing a git patch. The SHA is recorded
          # but not trusted as the sole recovery signal because the historic
          # checksum may have been written before the final payload split.
          recovered = None
          boundaries = [
              0,
              len(group00) - 1,
              9000,
              18000,
              18001,
              27000,
              27001,
              36000,
              36001,
          ]
          positions = []
          seen = set()
          for index in boundaries + list(range(len(group00))):
              if 0 <= index < len(group00) and index not in seen:
                  seen.add(index)
                  positions.append(index)

          for global_index in positions:
              repaired_text = group00[:global_index] + group00[global_index + 1:]
              try:
                  head = base64.b64decode(repaired_text, validate=True)
              except Exception:
                  continue
              compressed = head + tail
              try:
                  patch = gzip.decompress(compressed)
              except Exception:
                  continue
              if not patch.startswith(b'diff --git '):
                  continue
              if patch.count(b'\ndiff --git ') < 2:
                  continue
              recovered = {
                  'global_index': global_index,
                  'removed_character': group00[global_index],
                  'compressed': compressed,
                  'patch': patch,
                  'sha256': hashlib.sha256(compressed).hexdigest(),
              }
              break

          if recovered is None:
              (output / 'group00.raw.txt').write_text(group00)
              (output / 'group01.decoded.bin').write_bytes(
                  base64.b64decode(compact(group01_paths), validate=True)
              )
              (output / 'group02.decoded.bin').write_bytes(
                  base64.b64decode(compact(group02_paths), validate=True)
              )
              (output / 'group03.decoded.bin').write_bytes(
                  base64.b64decode(compact(group03_paths), validate=True)
              )
              report['recovered'] = False
          else:
              report.update({
                  'recovered': True,
                  'removed_global_index': recovered['global_index'],
                  'removed_character': recovered['removed_character'],
                  'compressed_bytes': len(recovered['compressed']),
                  'patch_bytes': len(recovered['patch']),
                  'actual_sha256': recovered['sha256'],
                  'matches_expected_sha256': recovered['sha256'] == expected,
              })
              (output / 'complete-backlog.patch.gz').write_bytes(recovered['compressed'])
              (output / 'complete-backlog.patch').write_bytes(recovered['patch'])

          (output / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
          tar -C /tmp -czf /tmp/complete-backlog-patch-diagnostics.tgz patch-diagnostics

      - uses: actions/upload-artifact@v4
        with:
          name: complete-backlog-patch-diagnostics-${{ github.sha }}
          path: /tmp/complete-backlog-patch-diagnostics.tgz
          retention-days: 3
