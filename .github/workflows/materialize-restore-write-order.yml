name: Materialize Restore Write Ordering

on:
  push:
    branches:
      - feature/durable-autosave-first-launch-import
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: feature/durable-autosave-first-launch-import
          fetch-depth: 0

      - name: Apply restore serialization repair
        run: python3 tool/fix_restore_write_order.py

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format, analyze, and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/store.dart test/persistence_onboarding_test.dart
          git diff --check
          flutter analyze --no-fatal-infos
          flutter test test/persistence_onboarding_test.dart --reporter expanded

      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'await _enqueueStateWrite(jsonEncode(exportState()));' lib/store.dart
          grep -q 'backup restore cannot be overwritten by an older queued save' test/persistence_onboarding_test.dart

      - name: Commit direct source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/store.dart test/persistence_onboarding_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Serialize backup restore with pending saves'
            git push origin HEAD:feature/durable-autosave-first-launch-import
          fi
