name: Repair Unified AppStore Scope

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab
          fetch-depth: 0

      - name: Restore the missing AppStore method boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/store.dart')
          text = path.read_text()
          old = '''    } on Object {\n      labDataDomains = previous;\n\n  DataImportBatch? get lastImportBatch =>\n'''
          new = '''    } on Object {\n      labDataDomains = previous;\n      notifyListeners();\n      rethrow;\n    }\n  }\n\n  DataImportBatch? get lastImportBatch =>\n'''
          if old not in text:
              raise SystemExit('Expected malformed AppStore boundary was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/store.dart
          git commit -m "Repair unified AppStore method scope"
          git push origin HEAD:agent/daily-inputs-gemini-lab
