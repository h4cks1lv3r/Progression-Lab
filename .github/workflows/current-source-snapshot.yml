name: Current Source Snapshot

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/daily-inputs-gemini-lab
      - name: Package current source
        run: |
          tar --exclude=.git --exclude=build --exclude=.dart_tool \
            -czf /tmp/Progression-Lab-current-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-current-source-${{ github.sha }}
          path: /tmp/Progression-Lab-current-source.tgz
          retention-days: 2
