name: Portability Autofix

on:
  push:
    branches:
      - agent/data-portability-backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portability-autofix
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: agent/data-portability-backup
          fetch-depth: 0

      - name: Check readiness
        id: source
        shell: bash
        run: |
          if compgen -G 'tool/data-portability.patch.part*' > /dev/null; then
            echo ready=true >> "$GITHUB_OUTPUT"
          else
            echo ready=false >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize source
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat tool/functional-brand.patch.part* | base64 --decode > /tmp/progression-target.patch.gz
          gzip -dc /tmp/progression-target.patch.gz > /tmp/progression-target.patch
          git apply /tmp/progression-target.patch
          git apply tool/analyzer-fixes.patch
          git apply tool/labpanel-material.patch
          git apply tool/athletic-test-scroll.patch
          git apply tool/launch-background-fix.patch
          cat tool/high-priority.patch.part* | base64 --decode > /tmp/high-priority.patch.gz
          gzip -dc /tmp/high-priority.patch.gz > /tmp/high-priority.patch
          git apply /tmp/high-priority.patch
          git apply tool/high-priority-fixes.patch
          git apply --exclude=lib/brand.dart tool/route-typography-fix.patch
          git apply tool/brand-route-material.patch
          cat tool/data-portability.patch.part* | base64 --decode > /tmp/data-portability.patch.gz
          gzip -dc /tmp/data-portability.patch.gz > /tmp/data-portability.patch
          git apply /tmp/data-portability.patch

      - name: Record pre-fix source
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p /tmp/portability-pre-fix
          rsync -a --exclude=.git ./ /tmp/portability-pre-fix/

      - name: Set up Java
        if: steps.source.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        if: steps.source.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply Dart fixes and validate
        if: steps.source.outputs.ready == 'true'
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            flutter pub get
            dart fix --apply
            dart format lib test
            flutter analyze --no-fatal-infos
            flutter test
          } 2>&1 | tee /tmp/autofix.txt

      - name: Generate validated fix patch
        if: steps.source.outputs.ready == 'true' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORK=/tmp/portability-post-fix
          mkdir -p "$WORK"
          rsync -a --exclude=.git ./ "$WORK/"
          cd /tmp/portability-pre-fix
          git init -q
          git config user.name autofix
          git config user.email autofix@example.invalid
          git add -A
          git commit -qm baseline
          rsync -a --delete --exclude=.git "$WORK/" /tmp/portability-pre-fix/
          git diff --binary > /tmp/data-portability-repair.patch

      - name: Reset and publish result
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            if [[ -s /tmp/data-portability-repair.patch ]]; then
              cp /tmp/data-portability-repair.patch tool/data-portability-repair.patch
              python3 - <<'PY'
          from pathlib import Path
          for path in [Path('.github/workflows/android-apk.yml'), Path('.github/workflows/ios-test-build.yml')]:
              text = path.read_text()
              if 'data-portability-repair.patch' in text:
                  continue
              marker = '          git apply /tmp/data-portability.patch\n'
              if marker not in text:
                  raise SystemExit(f'Missing portability marker in {path}')
              text = text.replace(
                  marker,
                  marker + '          git apply --check tool/data-portability-repair.patch\n          git apply tool/data-portability-repair.patch\n',
                  1,
              )
              path.write_text(text)
          PY
            fi
            echo 'All portability analysis and tests passed after Dart fixes.' > PORTABILITY_AUTOFIX_RESULT.txt
          else
            cp /tmp/autofix.txt PORTABILITY_AUTOFIX_FAILURE.txt
          fi
          rm -f .github/workflows/portability-autofix.yml

      - name: Commit autofix result
        if: steps.source.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply portability compiler fixes [autofix]"
          git pull --rebase origin agent/data-portability-backup
          git push origin HEAD:agent/data-portability-backup
