name: iOS Test Builds

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/daily-inputs-gemini-lab
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Verify and build iOS test artifacts
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        shell: bash
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Verify iOS project configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          test -f ios/Runner/Info.plist
          plutil -lint ios/Runner/Info.plist
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | head

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Read application version
        id: version
        shell: bash
        run: |
          version_line="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [[ ! "$version_line" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid pubspec version: $version_line" >&2
            exit 1
          fi
          echo "name=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --simulator \
            --debug \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            "dist/Progression-Lab-${{ steps.version.outputs.name }}-iOS-Simulator.app.zip"

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.number }}"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (cd dist && zip -qry \
            "Progression-Lab-${{ steps.version.outputs.name }}-unsigned.ipa" \
            Payload)
          rm -rf dist/Payload

      - name: Package iOS project and checksums
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent ios \
            "dist/Progression-Lab-${{ steps.version.outputs.name }}-iOS-Project.zip"
          (
            cd dist
            shasum -a 256 \
              "Progression-Lab-${{ steps.version.outputs.name }}-iOS-Simulator.app.zip" \
              "Progression-Lab-${{ steps.version.outputs.name }}-unsigned.ipa" \
              "Progression-Lab-${{ steps.version.outputs.name }}-iOS-Project.zip" \
              > "Progression-Lab-${{ steps.version.outputs.name }}-iOS.sha256"
          )

      - name: Upload iOS test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Progression-Lab-${{ steps.version.outputs.name }}-iOS-build-${{ steps.version.outputs.number }}
          path: |
            dist/Progression-Lab-${{ steps.version.outputs.name }}-iOS-Simulator.app.zip
            dist/Progression-Lab-${{ steps.version.outputs.name }}-unsigned.ipa
            dist/Progression-Lab-${{ steps.version.outputs.name }}-iOS-Project.zip
            dist/Progression-Lab-${{ steps.version.outputs.name }}-iOS.sha256
          if-no-files-found: error
          retention-days: 30
